<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>📚 ChaPpy 英語電子辞書</title>
<!-- iOSでホーム画面に追加したとき、Safariのバーなしでアプリのように全画面起動させるための設定 -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ChaPpy">
<meta name="theme-color" content="#1d1e25">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='40' fill='%231d1e25'/%3E%3Ctext x='90' y='118' font-size='96' text-anchor='middle'%3E%F0%9F%93%9A%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Kaisei+Decol:wght@400;700&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
/* ==========================================================================
   ChaPpy 英語電子辞書 — 参考書・ノート風デザイン
   （フォントはオンライン時のみ読み込み。オフラインでも読み込み失敗時は
   　自動でゴシック体にフォールバックし、全機能はそのまま動作します）
   ========================================================================== */
:root{
  /* ダークモード固定のカラーパレット */
  --paper:#1d1e25;
  --paper2:#26272f;
  --ink:#eef0f5;
  --ink-soft:#a9adbd;
  --grid:#3a3c48;
  --card-solid:#26272f;
  --red:#e2665a;
  --red-deep:#ff8b7d;
  --navy:#7fa8d9;
  --navy-soft:#9db9e0;
  --gold:#e0b45c;
  --ok:#57b17f;
  --blue:#7fa8d9;
  --blue-tint:rgba(127,168,217,0.14);
  --yellow:#f2c744;
  --shadow-sm: 3px 3px 0 rgba(0,0,0,0.35);
  --shadow-md: 4px 4px 0 rgba(0,0,0,0.4);
  --shadow-lg: 6px 6px 0 rgba(0,0,0,0.5);
  --radius-lg: 6px;
  --radius-md: 4px;
  --radius-sm: 3px;
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  --safe-top: env(safe-area-inset-top, 0px);
}

*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{
  margin:0;
  font-family:"Zen Kaku Gothic New","Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
  background:var(--paper);
  background-image:
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 30px 30px;
  color:var(--ink);
  transition:background .4s ease, color .4s ease;
  overscroll-behavior-y:none;
  -webkit-font-smoothing:antialiased;
}
img,svg{display:block;}
button{font-family:inherit;}

/* ---------- layout shells ---------- */
#app{
  max-width:900px;
  margin:0 auto;
  min-height:100vh;
  padding-bottom:calc(84px + var(--safe-bottom));
  position:relative;
}
.screen{display:none;}
.screen.active{display:block; animation:fadeIn .35s ease;}
@keyframes fadeIn{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);}}

/* ---------- top bar ---------- */
.topbar{
  position:sticky; top:0; z-index:50;
  padding:calc(10px + var(--safe-top)) 16px 10px;
  background:var(--paper);
  border-bottom:2px solid var(--ink);
  display:flex; align-items:center; gap:10px;
  transition:background .4s ease, border-color .4s ease;
}
.topbar h1{
  font-family:"Kaisei Decol",serif;
  font-size:19px; font-weight:700; margin:0; flex:1;
  letter-spacing:.02em;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.icon-btn{
  width:36px; height:36px; border-radius:50%;
  border:1.5px solid var(--ink); background:var(--card-solid); color:var(--ink);
  font-size:16px; display:flex; align-items:center; justify-content:center;
  cursor:pointer; flex-shrink:0; box-shadow:2px 2px 0 rgba(34,36,46,.15);
  transition:transform .15s ease;
}
.icon-btn:active{transform:translate(1px,1px); box-shadow:none;}
.back-btn{
  border:none; background:none; color:var(--ink);
  font-family:"Kaisei Decol",serif;
  font-size:16px; font-weight:700; display:flex; align-items:center; gap:2px;
  cursor:pointer; padding:6px 4px 6px 0; flex-shrink:0;
}
.back-btn:active{opacity:.5;}

/* ---------- content padding ---------- */
.content{padding:16px;}
.section-title{
  font-family:"Kaisei Decol",serif;
  font-size:13px; font-weight:700; color:var(--ink-soft);
  letter-spacing:.06em;
  margin:22px 4px 10px;
}
.section-title:first-child{margin-top:6px;}

/* ---------- hero (home) ---------- */
.hero{
  text-align:center; padding:26px 16px 6px; position:relative;
}
.hero-title{
  font-family:"Kaisei Decol",serif;
  font-size:28px; font-weight:700; letter-spacing:.02em; margin:0 0 6px;
  color:var(--ink);
  display:inline-block;
  background-image:linear-gradient(120deg, rgba(242,199,68,.55) 0%, rgba(242,199,68,.55) 100%);
  background-repeat:no-repeat;
  background-size:100% 38%;
  background-position:0 78%;
  padding:0 4px;
}
.hero-sub{font-size:13px; color:var(--ink-soft); margin:6px 0 20px;}

/* ---------- search ---------- */
.search-wrap{position:relative; margin:0 0 8px;}
.search-input{
  width:100%; padding:13px 42px 13px 42px;
  border-radius:var(--radius-md); border:1.5px solid var(--ink);
  background:var(--card-solid); color:var(--ink);
  font-size:16px; outline:none;
  box-shadow:var(--shadow-sm);
  transition:box-shadow .2s ease;
}
.search-input:focus{box-shadow:3px 3px 0 var(--navy);}
.search-icon{
  position:absolute; left:14px; top:50%; transform:translateY(-50%);
  font-size:16px; color:var(--ink-soft); pointer-events:none;
}
.search-clear{
  position:absolute; right:8px; top:50%; transform:translateY(-50%);
  width:26px; height:26px; border:1px solid var(--grid); border-radius:50%;
  background:var(--paper2); color:var(--ink-soft); font-size:13px;
  display:none; align-items:center; justify-content:center; cursor:pointer;
}

.search-results{margin-top:10px;}
.search-hit{
  display:flex; align-items:center; gap:10px;
  padding:12px 14px; margin-bottom:8px;
  background:var(--card-solid); border-radius:var(--radius-sm);
  box-shadow:var(--shadow-sm); cursor:pointer; border:1.5px solid var(--ink);
}
.search-hit:active{transform:translate(1px,1px); box-shadow:none;}
.search-hit .badge{
  font-family:"Kaisei Decol",serif;
  font-size:11px; font-weight:700; color:#fff;
  background:var(--navy); padding:3px 8px; border-radius:20px; flex-shrink:0;
}
.search-hit .hit-title{font-weight:700; font-size:15px; flex:1;}
.search-hit .hit-snip{font-size:12px; color:var(--ink-soft); display:block; margin-top:2px;}
.search-empty{text-align:center; color:var(--ink-soft); font-size:14px; padding:30px 10px;}

/* ---------- category cards ---------- */
.cat-grid{display:flex; flex-direction:column; gap:16px; margin-top:18px;}
.cat-card{
  display:flex; align-items:center; gap:14px;
  padding:18px 18px 18px 22px; border-radius:var(--radius-lg);
  background:var(--card-solid); box-shadow:var(--shadow-md);
  border:1.5px solid var(--ink);
  cursor:pointer; position:relative; overflow:visible;
  transition:transform .15s ease, box-shadow .15s ease;
}
.cat-card::before{
  content:attr(data-tab);
  position:absolute; top:-13px; left:16px;
  font-family:"Kaisei Decol",serif; font-size:11px; color:#fff;
  padding:3px 10px; border-radius:2px; letter-spacing:.08em;
}
.cat-card:active{transform:translate(2px,2px); box-shadow:none;}
.cat-card .cat-emoji{font-size:32px; flex-shrink:0;}
.cat-card .cat-info{flex:1;}
.cat-card .cat-name{font-family:"Kaisei Decol",serif; font-size:18px; font-weight:700; margin:0 0 2px;}
.cat-card .cat-desc{font-size:12.5px; color:var(--ink-soft); margin:0;}
.cat-card .cat-arrow{font-size:20px; color:var(--ink-soft); flex-shrink:0;}
.cat-card.g1::before{background:var(--navy);}
.cat-card.g2::before{background:var(--ok);}
.cat-card.g3::before{background:var(--red);}
.cat-card.g1{border-left:5px solid var(--navy);}
.cat-card.g2{border-left:5px solid var(--ok);}
.cat-card.g3{border-left:5px solid var(--red);}

.quick-row{display:flex; gap:10px; margin-top:18px;}
.quick-btn{
  flex:1; display:flex; flex-direction:column; align-items:center; gap:6px;
  padding:13px 6px; border-radius:var(--radius-md);
  background:var(--card-solid); box-shadow:var(--shadow-sm); border:1.5px solid var(--ink);
  cursor:pointer; font-size:11.5px; font-weight:700; color:var(--ink);
}
.quick-btn:active{transform:translate(1px,1px); box-shadow:none;}
.quick-btn .qi{font-size:21px;}

/* ---------- grade screen ---------- */
.grade-hero{padding:18px 4px 4px;}
.grade-hero h2{font-family:"Kaisei Decol",serif; font-size:24px; font-weight:700; margin:0 0 4px;}
.grade-hero p{color:var(--ink-soft); font-size:12.5px; margin:0;}

.toc-scroll{
  display:flex; gap:8px; overflow-x:auto; padding:14px 0 6px;
  scrollbar-width:none;
}
.toc-scroll::-webkit-scrollbar{display:none;}
.toc-chip{
  flex-shrink:0; padding:7px 13px; border-radius:20px;
  background:var(--card-solid); color:var(--ink); font-size:12.5px; font-weight:600;
  white-space:nowrap; cursor:pointer; border:1.5px solid var(--ink);
}
.toc-chip:active{background:var(--paper2);}

.unit-list{display:flex; flex-direction:column; gap:10px; margin-top:8px;}
.unit-card{
  display:flex; align-items:center; gap:12px;
  padding:15px 16px; border-radius:var(--radius-md);
  background:var(--card-solid); box-shadow:var(--shadow-sm); border:1.5px solid var(--ink);
  cursor:pointer; scroll-margin-top:120px;
  transition:transform .13s ease, box-shadow .13s ease;
}
.unit-card:active{transform:translate(2px,2px); box-shadow:none;}
.unit-num{
  width:30px; height:30px; border-radius:50%; flex-shrink:0;
  background:var(--navy); color:#fff; font-family:"Kaisei Decol",serif; font-weight:700; font-size:13px;
  display:flex; align-items:center; justify-content:center;
}
.unit-main{flex:1; min-width:0;}
.unit-name{font-size:14.5px; font-weight:700; margin:0 0 3px;}
.unit-stars{font-size:11px; color:var(--gold); letter-spacing:1px;}
.unit-fav-star{font-size:19px; color:var(--grid); background:none; border:none; cursor:pointer; flex-shrink:0; padding:4px;}
.unit-fav-star.on{color:var(--gold);}
.unit-chevron{color:var(--ink-soft); font-size:16px; flex-shrink:0;}

/* ---------- unit detail ---------- */
.unit-head{padding:18px 4px 6px;}
.unit-head-top{display:flex; align-items:flex-start; justify-content:space-between; gap:10px;}
.unit-head h2{font-family:"Kaisei Decol",serif; font-size:23px; font-weight:700; margin:0 0 6px;}
.unit-head .stars-row{font-size:14px; color:var(--gold); letter-spacing:2px;}
.fav-toggle{
  width:42px; height:42px; border-radius:50%; flex-shrink:0;
  background:var(--card-solid); border:1.5px solid var(--ink); box-shadow:var(--shadow-sm);
  font-size:19px; color:var(--grid); display:flex; align-items:center; justify-content:center;
  cursor:pointer;
}
.fav-toggle.on{color:var(--gold);}
.fav-toggle:active{transform:translate(1px,1px); box-shadow:none;}

.card{
  background:var(--card-solid); border-radius:var(--radius-lg);
  box-shadow:var(--shadow-md); border:1.5px solid var(--ink);
  padding:17px; margin-bottom:18px;
  scroll-margin-top:70px;
}
.card-title{
  display:flex; align-items:center; gap:8px;
  font-family:"Kaisei Decol",serif;
  font-size:16px; font-weight:700; margin:0 0 12px;
}
.must-card{
  position:relative;
  background:var(--card-solid);
  border:2px dashed var(--red);
}
.must-card::after{
  content:"重要"; position:absolute; top:-11px; right:14px;
  background:var(--red); color:#fff; font-family:"Kaisei Decol",serif;
  font-size:11px; padding:3px 10px; border-radius:2px; letter-spacing:.1em;
  transform:rotate(3deg);
}
.must-list{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:8px;}
.must-list li{
  font-size:14px; line-height:1.6; padding:10px 12px;
  background:var(--paper2); border-radius:var(--radius-sm);
  border:1px solid var(--grid);
}
.must-list b{
  font-weight:700; color:var(--ink); background-image:linear-gradient(120deg, rgba(242,199,68,.6) 0%, rgba(242,199,68,.6) 100%);
  background-repeat:no-repeat; background-size:100% 55%; background-position:0 88%; padding:0 1px;
}

.explain-flow{display:flex; flex-direction:column; gap:2px; margin-bottom:10px;}
.explain-box{
  padding:13px; border-radius:var(--radius-sm);
  background:var(--paper2); border:1px dashed var(--grid);
  font-size:14.5px; line-height:1.6;
}
.explain-box .tag{
  font-family:"Kaisei Decol",serif;
  display:inline-block; font-size:11px; font-weight:700; padding:2px 8px;
  border-radius:20px; margin-bottom:6px;
}
.tag-before{background:var(--grid); color:var(--ink-soft);}
.tag-after{background:var(--navy); color:#fff;}
.arrow-down{
  text-align:center; font-size:20px; color:var(--navy); margin:2px 0; font-weight:700;
}
.explain-note{
  font-size:13px; color:var(--ink-soft); line-height:1.65; margin-top:10px;
  padding-top:10px; border-top:1px dashed var(--grid);
}

.example-item{
  padding:12px 0; border-bottom:1px dashed var(--grid);
}
.example-item:last-child{border-bottom:none; padding-bottom:0;}
.example-item:first-child{padding-top:0;}
.example-en{font-size:15px; font-weight:700; margin:0 0 3px;}
.example-ja{font-size:13px; color:var(--ink-soft); margin:0;}

/* ---------- sticky-note mnemonic card ---------- */
.mnemonic-card{
  background:#3a3420; border:1.5px solid #7a682e; color:#f2e6b0;
  transform:rotate(-1.2deg); box-shadow:var(--shadow-md);
  position:relative;
}
.mnemonic-card::before{
  content:"📌"; position:absolute; top:-14px; left:50%; transform:translateX(-50%) rotate(8deg);
  font-size:20px;
}
.mnemonic-card .card-title{color:inherit;}
.mnemonic-text{font-size:15px; line-height:1.7; font-weight:700; margin:0;}

.mistake-list{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:8px;}
.mistake-list li{
  font-size:13.5px; line-height:1.55; padding:10px 12px 10px 36px; position:relative;
  background:var(--paper2); border-radius:var(--radius-sm);
  border:1px solid var(--grid); border-left:4px solid var(--red);
}
.mistake-list li::before{
  content:"⚠️"; position:absolute; left:10px; top:9px; font-size:13px;
}

.check-card{ border:2px solid var(--ink); }
.check-inner{ position:relative; }
.check-q{font-family:"Kaisei Decol",serif; font-size:15px; font-weight:700; margin:0 0 12px;}
.check-btn{
  width:100%; padding:12px; border-radius:var(--radius-sm); border:1.5px solid var(--ink);
  background:var(--ink); color:var(--paper); font-family:"Kaisei Decol",serif;
  font-size:14.5px; font-weight:700; cursor:pointer; box-shadow:3px 3px 0 var(--red);
  transition:transform .12s ease;
}
.check-btn:active{transform:translate(2px,2px); box-shadow:none;}
.check-answer{
  margin-top:10px; padding:12px; border-radius:var(--radius-sm);
  background:var(--paper2); font-size:14px; line-height:1.6; display:none;
  border:1px solid var(--grid); position:relative;
}
.check-answer.show{display:block; animation:fadeIn .3s ease;}

/* ---------- stamp (hanko-style ○ mark on reveal) ---------- */
.stamp-wrap{ position:relative; float:right; width:0; height:0; }
.stamp{
  position:absolute; top:-6px; right:-6px; width:58px; height:58px; border-radius:50%;
  border:3px solid var(--red-deep); color:var(--red-deep);
  display:flex; align-items:center; justify-content:center;
  font-family:"Kaisei Decol",serif; font-size:13px; letter-spacing:.05em;
  transform:rotate(-14deg) scale(0); opacity:.9; pointer-events:none;
}
.check-answer.show .stamp, .quiz-a.show .stamp{
  animation: stampIn .4s cubic-bezier(.2,1.4,.5,1) forwards;
}
@keyframes stampIn{ to{ transform:rotate(-14deg) scale(1); } }

/* ---------- quiz screen ---------- */
.quiz-wrap{padding:10px 4px;}
.quiz-progress{
  font-family:"Kaisei Decol",serif;
  font-size:13px; color:var(--ink-soft); text-align:center; margin-bottom:14px; font-weight:700;
}
.quiz-card{
  background:var(--card-solid); border-radius:var(--radius-lg); box-shadow:var(--shadow-lg);
  border:2px solid var(--ink); padding:28px 20px; min-height:220px;
  display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center;
  cursor:pointer; position:relative;
}
.quiz-badge{
  font-family:"Kaisei Decol",serif;
  font-size:11px; font-weight:700; color:#fff; background:var(--navy); padding:4px 10px; border-radius:20px; margin-bottom:14px;
}
.quiz-q{font-size:16.5px; font-weight:700; line-height:1.6;}
.quiz-hint{font-size:12px; color:var(--ink-soft); margin-top:16px;}
.quiz-a{font-size:15.5px; line-height:1.7; color:var(--ink); font-weight:700; display:none; position:relative; width:100%;}
.quiz-a.show{display:block; animation:fadeIn .3s ease;}
.quiz-btnrow{display:flex; gap:10px; margin-top:16px;}
.quiz-action{
  flex:1; padding:14px; border-radius:var(--radius-md); border:1.5px solid var(--ink);
  font-family:"Kaisei Decol",serif; font-size:15px; font-weight:700; cursor:pointer;
}
.quiz-next{background:var(--ink); color:var(--paper); box-shadow:3px 3px 0 var(--navy);}
.quiz-next:active{transform:translate(2px,2px); box-shadow:none;}

/* ---------- favorites / empty ---------- */
.empty-state{text-align:center; padding:60px 20px; color:var(--ink-soft);}
.empty-state .ee{font-size:46px; margin-bottom:12px;}
.empty-state p{font-size:14px; line-height:1.6; margin:0;}

/* ---------- bottom tab bar ---------- */
.tabbar{
  position:fixed; left:0; right:0; bottom:0; z-index:60;
  max-width:900px; margin:0 auto;
  display:flex; justify-content:space-around;
  padding:8px 6px calc(8px + var(--safe-bottom));
  background:var(--paper);
  border-top:2px solid var(--ink);
}
.tab-btn{
  display:flex; flex-direction:column; align-items:center; gap:3px;
  background:none; border:none; color:var(--ink-soft); font-size:10.5px; font-weight:700;
  padding:4px 14px; cursor:pointer; border-radius:12px; font-family:"Zen Kaku Gothic New",sans-serif;
}
.tab-btn .ti{font-size:20px;}
.tab-btn.active{color:var(--red-deep);}

/* ---------- scroll to top ---------- */
.top-fab{
  position:fixed; right:18px; bottom:calc(84px + var(--safe-bottom));
  width:42px; height:42px; border-radius:50%;
  background:var(--ink); color:var(--paper); border:1.5px solid var(--ink); box-shadow:var(--shadow-md);
  font-size:17px; display:none; align-items:center; justify-content:center; cursor:pointer;
  z-index:55; max-width:900px;
}
.top-fab.show{display:flex; animation:fadeIn .2s ease;}
.top-fab:active{transform:translate(2px,2px); box-shadow:none;}

/* ---------- misc ---------- */
::selection{background:rgba(242,199,68,.55);}
.hidden{display:none !important;}

@media (min-width:640px){
  .hero-title{font-size:32px;}
  .cat-grid{flex-direction:row; flex-wrap:wrap;}
  .cat-card{flex:1 1 calc(50% - 8px);}
}
</style>
</head>
<body>

<div id="app">

  <!-- ============ TOP BAR ============ -->
  <div class="topbar">
    <button class="back-btn hidden" id="backBtn" onclick="goBack()">‹ 戻る</button>
    <h1 id="topTitle">📚 ChaPpy 英語電子辞書</h1>
  </div>

  <!-- ============ HOME SCREEN ============ -->
  <section class="screen active" id="screen-home">
    <div class="content">
      <div class="hero">
        <p class="hero-title">📚 ChaPpy 英語電子辞書</p>
        <p class="hero-sub">中学英文法を、小学生でもわかるレベルで。</p>
      </div>

      <div class="search-wrap">
        <span class="search-icon">🔍</span>
        <input type="text" class="search-input" id="searchInput" placeholder="例：受動態、can、比較級…" oninput="onSearch()">
        <button class="search-clear" id="searchClear" onclick="clearSearch()">✕</button>
      </div>

      <div id="searchResults" class="search-results hidden"></div>

      <div id="homeDefault">
        <div class="quick-row">
          <button class="quick-btn" onclick="showFavorites()"><span class="qi">⭐</span>お気に入り</button>
          <button class="quick-btn" onclick="startQuiz()"><span class="qi">📝</span>一問一答</button>
          <button class="quick-btn" onclick="startQuiz(true)"><span class="qi">🎲</span>ランダム暗記</button>

          {en:"It has been raining since last night.", ja:"昨夜からずっと雨が降り続いています。"}
        ],
        mnemonic:"「ハブ・ビーン・イングで ずっと〜し続け中」",
        mistakes:[
          "状態動詞（know/like/haveなど）を進行形にしてしまう（“have been knowing” ✕）"
        ],
        check:{q:"「彼は今朝からずっとサッカーの練習をしています。」を英語にすると？", a:"He has been practicing soccer since this morning."}
      },
      {
        title:"分詞（現在分詞・過去分詞の形容詞用法）", importance:4,
        points:[
          "<b>現在分詞（〜ing）</b>＝「〜している」（能動・進行の意味）",
          "<b>過去分詞（〜ed等）</b>＝「〜された」（受け身の意味）",
          "1語なら名詞の<b>前</b>、他の語句を伴うなら名詞の<b>後ろ</b>から修飾"
        ],
        before:{tag:"現在分詞", text:"a sleeping baby（眠っている赤ちゃん＝赤ちゃんが眠る）"},
        after:{tag:"過去分詞", text:"a broken window（割られた窓＝窓が割られる）"},
        note:"「〜している」なら現在分詞、「〜される・〜された」なら過去分詞と覚える。名詞を後ろから説明するときは、分詞のあとに他の語句がついている場合。",
        examples:[
          {en:"The boy playing soccer is my brother.", ja:"サッカーをしている少年は私の弟です。"},
          {en:"This is a picture painted by a famous artist.", ja:"これは有名な芸術家によって描かれた絵です。"},
          {en:"I have a broken phone.", ja:"私は壊れた電話を持っています。"}
        ],
        mnemonic:"「イングは している側、過去分詞は される側」",
        mistakes:[
          "現在分詞と過去分詞を意味的に逆に使ってしまう（“an excited game” ✕ → “an exciting game” ○、人が興奮＝excited、物がわくわくさせる＝exciting）"
        ],
        check:{q:"「あの走っている犬を見て。」を英語にすると？", a:"Look at that running dog. / Look at the dog running over there."}
      },
      {
        title:"関係代名詞（who / which / that）", importance:5,
        points:[
          "<b>who</b>：先行詞が<b>人</b>（主格・目的格）",
          "<b>which</b>：先行詞が<b>もの・動物</b>",
          "<b>that</b>：人・もの両方に使える万能タイプ",
          "先行詞（説明したい名詞）の直後に関係代名詞＋説明が続く"
        ],
        before:{tag:"2つの文", text:"I have a friend. + He can speak French."},
        after:{tag:"関係代名詞で1文に", text:"I have a friend who can speak French.（フランス語を話せる友達）"},
        note:"関係代名詞は「後ろから名詞をくわしく説明するのり」。2つの文を1つにまとめて、名詞をもっと詳しく紹介できる。",
        examples:[
          {en:"The girl who is singing over there is Mika.", ja:"あそこで歌っている女の子はミカです。"},
          {en:"This is the book which I bought yesterday.", ja:"これは私が昨日買った本です。"},
          {en:"I know a boy that runs very fast.", ja:"私はとても速く走る男の子を知っています。"}
        ],
        mnemonic:"「ヒトはwho、モノはwhich、まよったらthat」",
        mistakes:[
          "先行詞が人なのにwhichを使ってしまう",
          "関係代名詞の後ろに主語を重ねて置いてしまう（“a friend who he can speak” ✕）"
        ],
        check:{q:"「これは私の母が作ったケーキです。」を関係代名詞whichを使って英語にすると？", a:"This is the cake which my mother made."}
      },
      {
        title:"間接疑問文", importance:4,
        points:[
          "疑問文が他の文の一部（目的語）になったもの",
          "語順が<b>疑問詞＋主語＋動詞</b>のふつうの文の語順に変わる（疑問文の倒置をやめる）",
          "know, tell, wonder などの後ろによく使われる"
        ],
        before:{tag:"ふつうの疑問文", text:"Where does he live?"},
        after:{tag:"間接疑問文", text:"I don't know where he lives.（彼がどこに住んでいるか知りません）"},
        note:"疑問文をそのまま文の中に組み込むと、doやdoesが消えて動詞が主語に合わせた形に戻り、語順も「疑問詞＋主語＋動詞」という普通の文の順番になる。",
        examples:[
          {en:"Do you know what this word means?", ja:"あなたはこの単語が何を意味するか知っていますか？"},
          {en:"I don't know who that man is.", ja:"私はあの男性が誰なのか知りません。"},
          {en:"Please tell me when the train will arrive.", ja:"電車がいつ到着するか教えてください。"}
        ],
        mnemonic:"「疑問詞のあとは ふつうの語順に もどす」",
        mistakes:[
          "間接疑問文の中でも疑問文の語順のままにしてしまう（“I know where does he live.” ✕ → “I know where he lives.” ○）"
        ],
        check:{q:"「彼女がなぜ怒っているのか私にはわかりません。」を英語にすると？", a:"I don't know why she is angry."}
      }
    ]
  }
];

/* IDを割り当て + フラット化して扱いやすくする */
let uidCounter = 0;
const ALL_UNITS = [];
GRADES.forEach(g=>{
  g.units.forEach(u=>{
    u.id = "u" + (uidCounter++);
    u.grade = g.grade;
    u.gradeKey = g.key;
    u.gradeName = g.name;
    ALL_UNITS.push(u);
  });
});

/* ==========================================================================
   状態管理（すべてメモリ内 / このセッション限り）
   ========================================================================== */
const state = {
  favorites: new Set(),
  history: [],           // 画面遷移の履歴（戻るボタン用）
  currentGrade: null,
  quizPool: [],
  quizIndex: 0
};

/* ==========================================================================
   画面遷移
   ========================================================================== */
function showScreen(id, title, showBack){
  document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));
  document.getElementById(id).classList.add("active");
  document.getElementById("topTitle").textContent = title;
  document.getElementById("backBtn").classList.toggle("hidden", !showBack);
  window.scrollTo({top:0, behavior:"instant" in window ? "instant" : "auto"});
  setActiveTab(id);
}

function setActiveTab(id){
  document.getElementById("tab-home").classList.toggle("active", id==="screen-home");
  document.getElementById("tab-fav").classList.toggle("active", id==="screen-favorites");
  document.getElementById("tab-quiz").classList.toggle("active", id==="screen-quiz");
}

function goHome(){
  state.history = [];
  showScreen("screen-home","📚 ChaPpy 英語電子辞書", false);
}

function goBack(){
  state.history.pop();
  const prev = state.history[state.history.length-1];
  if(!prev){ goHome(); return; }
  if(prev.type==="grade") openGrade(prev.key, false);
  else if(prev.type==="home") goHome();
  else goHome();
}

function pushHistory(entry){ state.history.push(entry); }

/* ==========================================================================
   ホーム：カテゴリーカード描画
   ========================================================================== */
function renderCategoryCards(){
  const grid = document.getElementById("catGrid");
  grid.innerHTML = GRADES.map(g=>`
    <div class="cat-card g${g.grade}" data-tab="${g.name}" onclick="openGrade('${g.key}', true)">
      <div class="cat-emoji">${g.emoji}</div>
      <div class="cat-info">
        <p class="cat-name">${g.name}</p>
        <p class="cat-desc">${g.desc}（全${g.units.length}単元）</p>
      </div>
      <div class="cat-arrow">›</div>
    </div>
  `).join("");
}
renderCategoryCards();

/* ==========================================================================
   検索（リアルタイム）
   ========================================================================== */
function onSearch(){
  const q = document.getElementById("searchInput").value.trim();
  const clearBtn = document.getElementById("searchClear");
  const resultsBox = document.getElementById("searchResults");
  const defaultBox = document.getElementById("homeDefault");
  clearBtn.style.display = q ? "flex" : "none";

  if(!q){
    resultsBox.classList.add("hidden");
    defaultBox.classList.remove("hidden");
    return;
  }
  defaultBox.classList.add("hidden");
  resultsBox.classList.remove("hidden");

  const qLower = q.toLowerCase();
  const hits = ALL_UNITS.filter(u=>{
    const hay = (u.title + " " + u.points.join(" ") + " " + (u.note||"") + " " +
                 u.examples.map(e=>e.en+" "+e.ja).join(" ") + " " + u.mnemonic + " " +
                 u.mistakes.join(" ")).toLowerCase();
    return hay.includes(qLower);
  });

  if(hits.length===0){
    resultsBox.innerHTML = `<div class="search-empty">😢「${escapeHtml(q)}」に一致する単元が見つかりませんでした。</div>`;
    return;
  }

  resultsBox.innerHTML = hits.map(u=>`
    <div class="search-hit" onclick="openUnitFromSearch('${u.id}')">
      <span class="badge">${u.gradeName}</span>
      <div style="flex:1;min-width:0;">
        <p class="hit-title">${u.title}</p>
        <span class="hit-snip">${u.points[0].replace(/<[^>]+>/g,'')}</span>
      </div>
      <div class="unit-chevron">›</div>
    </div>
  `).join("");
}

function clearSearch(){
  document.getElementById("searchInput").value = "";
  onSearch();
  document.getElementById("searchInput").focus();
}

function openUnitFromSearch(id){
  const u = ALL_UNITS.find(x=>x.id===id);
  state.currentGrade = GRADES.find(g=>g.key===u.gradeKey);
  pushHistory({type:"grade", key:u.gradeKey});
  openUnit(id);
}

function escapeHtml(s){
  return s.replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

/* ==========================================================================
   学年画面
   ========================================================================== */
function openGrade(key, addHistory){
  const g = GRADES.find(x=>x.key===key);
  state.currentGrade = g;
  if(addHistory) pushHistory({type:"grade", key:key});

  document.getElementById("gradeTitle").textContent = g.emoji + " " + g.name;
  document.getElementById("gradeDesc").textContent = g.desc + "／全" + g.units.length + "単元を完全収録";

  document.getElementById("tocScroll").innerHTML = g.units.map((u,i)=>`
    <button class="toc-chip" onclick="scrollToUnitCard('${u.id}')">${i+1}. ${u.title.split("（")[0]}</button>
  `).join("");

  document.getElementById("unitList").innerHTML = g.units.map((u,i)=>`
    <div class="unit-card" id="card-${u.id}" onclick="openUnit('${u.id}')">
      <div class="unit-num">${i+1}</div>
      <div class="unit-main">
        <p class="unit-name">${u.title}</p>
        <span class="unit-stars">${starString(u.importance)}</span>
      </div>
      <button class="unit-fav-star ${state.favorites.has(u.id)?'on':''}" onclick="event.stopPropagation(); toggleFav('${u.id}', this)">★</button>
      <div class="unit-chevron">›</div>
    </div>
  `).join("");

  showScreen("screen-grade", g.name, true);
}

function scrollToUnitCard(id){
  const el = document.getElementById("card-"+id);
  if(el) el.scrollIntoView({behavior:"smooth", block:"center"});
}

function starString(n){
  return "★".repeat(n) + "☆".repeat(5-n);
}

/* ==========================================================================
   単元詳細画面
   ========================================================================== */
function openUnit(id, addHistory){
  const u = ALL_UNITS.find(x=>x.id===id);
  pushHistory({type:"unit", id:id});

  const isFav = state.favorites.has(u.id);

  document.getElementById("unitContent").innerHTML = `
    <div class="unit-head">
      <div class="unit-head-top">
        <div>
          <h2>${u.title}</h2>
          <div class="stars-row">${starString(u.importance)}</div>
        </div>
        <button class="fav-toggle ${isFav?'on':''}" id="unitFavBtn" onclick="toggleFav('${u.id}', this, true)">★</button>
      </div>
    </div>

    <div class="card must-card">
      <p class="card-title">🎯 テストで絶対出る！！</p>
      <ul class="must-list">
        ${u.points.map(p=>`<li>${p}</li>`).join("")}
      </ul>
    </div>

    <div class="card">
      <p class="card-title">🌟 小学生でもわかる説明</p>
      <div class="explain-flow">
        <div class="explain-box"><span class="tag tag-before">${u.before.tag}</span><br>${u.before.text}</div>
        <div class="arrow-down">↓</div>
        <div class="explain-box"><span class="tag tag-after">${u.after.tag}</span><br>${u.after.text}</div>
      </div>
      <p class="explain-note">${u.note}</p>
    </div>

    <div class="card">
      <p class="card-title">📝 例文</p>
      ${u.examples.map(e=>`
        <div class="example-item">
          <p class="example-en">${e.en}</p>
          <p class="example-ja">${e.ja}</p>
        </div>
      `).join("")}
    </div>

    <div class="card mnemonic-card">
      <p class="card-title">💡 覚え方（語呂合わせ）</p>
      <p class="mnemonic-text">${u.mnemonic}</p>
    </div>

    <div class="card">
      <p class="card-title">⚠️ 間違えやすいポイント</p>
      <ul class="mistake-list">
        ${u.mistakes.map(m=>`<li>${m}</li>`).join("")}
      </ul>
    </div>

    <div class="card check-card">
      <p class="card-title">📝 5秒チェック</p>
      <div class="check-inner">
        <p class="check-q">Q. ${u.check.q}</p>
        <button class="check-btn" onclick="revealCheck(this)">答えを見る</button>
        <div class="check-answer">
          <div class="stamp-wrap"><div class="stamp">できた</div></div>
          A. ${u.check.a}
        </div>
      </div>
    </div>
  `;

  showScreen("screen-unit", u.gradeName, true);
}

function revealCheck(btn){
  const ans = btn.nextElementSibling;
  ans.classList.add("show");
  btn.style.display = "none";
}

/* ==========================================================================
   お気に入り
   ========================================================================== */
function toggleFav(id, el, isDetail){
  if(state.favorites.has(id)){ state.favorites.delete(id); el.classList.remove("on"); }
  else { state.favorites.add(id); el.classList.add("on"); }

  // グレード画面のスターも同期
  const cardStar = document.querySelector(`#card-${id} .unit-fav-star`);
  if(cardStar) cardStar.classList.toggle("on", state.favorites.has(id));
}

function showFavorites(){
  const list = Array.from(state.favorites).map(id=>ALL_UNITS.find(u=>u.id===id)).filter(Boolean);
  const box = document.getElementById("favList");

  if(list.length===0){
    box.innerHTML = `<div class="empty-state"><div class="ee">⭐</div><p>まだお気に入りがありません。<br>単元画面の星マークをタップして登録しよう！</p></div>`;
  } else {
    box.innerHTML = list.map(u=>`
      <div class="unit-card" onclick="openUnit('${u.id}')">
        <div class="unit-num">${u.gradeName.slice(-2,-1)}</div>
        <div class="unit-main">
          <p class="unit-name">${u.title}</p>
          <span class="unit-stars">${starString(u.importance)}</span>
        </div>
        <button class="unit-fav-star on" onclick="event.stopPropagation(); toggleFavInList('${u.id}')">★</button>
        <div class="unit-chevron">›</div>
      </div>
    `).join("");
  }
  pushHistory({type:"home"});
  showScreen("screen-favorites","⭐ お気に入り", true);
}

function toggleFavInList(id){
  state.favorites.delete(id);
  showFavorites();
}

/* ==========================================================================
   一問一答（クイズ）モード
   ========================================================================== */
function startQuiz(shuffleAll){
  state.quizPool = ALL_UNITS.slice();
  shuffleArray(state.quizPool);
  state.quizIndex = 0;
  pushHistory({type:"home"});
  showScreen("screen-quiz","📝 一問一答", true);
  renderQuiz();
}

function shuffleArray(arr){
  for(let i=arr.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]] = [arr[j],arr[i]];
  }
}

function renderQuiz(){
  if(state.quizPool.length===0){ startQuiz(); return; }
  if(state.quizIndex >= state.quizPool.length){ state.quizIndex = 0; shuffleArray(state.quizPool); }

  const u = state.quizPool[state.quizIndex];
  document.getElementById("quizProgress").textContent = `${state.quizIndex+1} / ${state.quizPool.length} 問　（${u.gradeName}・${u.title}）`;
  document.getElementById("quizBadge").textContent = u.gradeName;
  document.getElementById("quizQ").textContent = "Q. " + u.check.q;
  document.getElementById("quizA").innerHTML = '<span class="stamp-wrap"><span class="stamp">できた</span></span>A. ' + u.check.a;
  document.getElementById("quizA").classList.remove("show");
  document.getElementById("quizHint").style.display = "block";
}

function revealQuizAnswer(){
  document.getElementById("quizA").classList.add("show");
  document.getElementById("quizHint").style.display = "none";
}

function nextQuiz(){
  state.quizIndex++;
  renderQuiz();
}

/* ==========================================================================
   トップへ戻るFAB
   ========================================================================== */
window.addEventListener("scroll", ()=>{
  const fab = document.getElementById("topFab");
  if(window.scrollY > 400) fab.classList.add("show");
  else fab.classList.remove("show");
});
function scrollToTop(){ window.scrollTo({top:0, behavior:"smooth"}); }

/* 初期化：ホーム画面の履歴を1つ積んでおく */
pushHistory({type:"home"});

</script>
